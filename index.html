<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KG Utils by Kacper Grzesik</title>

    <link rel="stylesheet" href="/src/css/main.css" />
    <script src="/src/js/main.js" defer></script>
  </head>
  <body>
    <main>
      <div class="feature">
        <div class="description-container">
          <h1 class="title">Kalkulator Kalorii</h1>
        </div>

        <div class="input-container">
          <input
            class="feature-input-text"
            type="number"
            placeholder="Wzrost"
          />
          <input class="feature-input-text" type="number" placeholder="Waga" />
          <input class="feature-input-text" type="number" placeholder="Wiek" />
          <input
            class="feature-input-text"
            type="input"
            placeholder="Docelowa waga"
          />
          <input class="feature-input-text" type="number" placeholder="Czas" />

          <div class="switch-container">
            <div id="is-imperial" class="feature-input-switch switch__off">
              <div class="feature-input-switch-slider"></div>
            </div>
            <p class="switch-text">Jednostki imperialne</p>
          </div>

          <input class="feature-submit" type="button" value="Oblicz!" />
        </div>
      </div>
    </main>
  </body>
</html>
