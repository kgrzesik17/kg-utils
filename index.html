<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KG Utils by Kacper Grzesik</title>

    <link rel="stylesheet" href="/src/css/main.css" />
    <script src="/src/js/main.js" defer></script>
  </head>
  <body>
    <main>
      <form class="feature" action="#" method="">
        <div class="description-container">
          <h1 class="title">Kalkulator Kalorii</h1>
        </div>

        <div class="inputs-container">
          <div id="height-metric" class="input-container">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="height"
              name="height"
              min="50"
              max="300"
            />
            <label for="height" id="height-label" class="input-label"
              >Wzrost (cm)</label
            >
          </div>
          <div
            id="height-imperial"
            class="input-container split-container hidden"
          >
            <div class="split-field">
              <input
                class="feature-input-text split-input"
                type="number"
                placeholder=" "
                id="height-ft"
                name="heightFt"
                min="2"
                max="10"
              />
              <label for="height-ft" class="input-label">Stopy (ft)</label>
            </div>

            <div class="split-divider"></div>

            <div class="split-field">
              <input
                class="feature-input-text split-input"
                type="number"
                placeholder=" "
                id="height-in"
                name="heightIn"
                min="0"
                max="12"
              />
              <label for="height-in" class="input-label">Cale (in)</label>
            </div>
          </div>
          <div id="weight-metric" class="input-container">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="weight"
              name="weight"
              min="20"
              max="500"
            />
            <label for="weight" id="weight-label" class="input-label"
              >Waga (kg)</label
            >
          </div>
          <div id="weight-imperial" class="input-container hidden">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="weight-lbs"
              name="weight-lbs"
              min="45"
              max="1100"
            />
            <label for="weight" id="weight-label" class="input-label"
              >Waga (lbs)</label
            >
          </div>
          <div class="input-container">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="age"
              name="age"
              min="0"
              max="120"
            />
            <label for="age" id="age-label" class="input-label">Wiek</label>
          </div>
          <div id="target-weight-metric" class="input-container">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="target-weight"
              name="targetWeight"
              min="20"
              max="400"
            />
            <label
              for="target-weight"
              id="target-weight-label"
              class="input-label"
              >Docelowa waga (kg)</label
            >
          </div>
          <div id="target-weight-imperial" class="input-container hidden">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="target-weight-lbs"
              name="targetWeight-lbs"
              min="45"
              max="1100"
            />
            <label
              for="target-weight"
              id="target-weight-label"
              class="input-label"
              >Docelowa waga (lbs)</label
            >
          </div>
          <div class="input-container">
            <input
              class="feature-input-text"
              type="number"
              placeholder=""
              id="time"
              name="time"
              min="1"
              max="1000"
            />
            <label for="time" id="time-label" class="input-label"
              >Czas (dni)</label
            >
          </div>

          <div class="switch-container">
            <div
              id="is-imperial"
              data-is-imperial="false"
              class="feature-input-switch switch__off"
            >
              <div class="feature-input-switch-slider"></div>
            </div>
            <!-- TODO -->
            <p class="switch-text">Jednostki imperialne</p>
          </div>

          <div class="radio-container">
            <input
              type="radio"
              id="sex-female"
              name="sex"
              value="female"
              checked
            />
            <label for="html">Kobieta</label><br />
            <input type="radio" id="sex-male" name="sex" value="male" />
            <label for="css">Mężczyzna</label><br />
          </div>

          <div class="slider-container">
            <label for="activity">Poziom aktywności</label>
            <input
              type="range"
              id="activity"
              name="activity"
              min="1"
              max="5"
              class="slider"
            />

            <p id="activity-description"></p>
          </div>

          <input class="feature-submit" type="submit" value="Oblicz!" />

          <div class="output" id="output"></div>
        </div>
      </form>
    </main>
  </body>
</html>
