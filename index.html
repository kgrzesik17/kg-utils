<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KG Utils by Kacper Grzesik</title>

    <link rel="stylesheet" href="/src/css/main.css" />
    <script src="/src/js/main.js" defer></script>
  </head>
  <body>
    <main>
      <form class="feature" action="" method="">
        <div class="description-container">
          <h1 class="title">Kalkulator Kalorii</h1>
        </div>

        <div class="input-container">
          <input
            class="feature-input-text"
            type="number"
            placeholder="Wzrost"
            id="height"
            name="height"
            min="50"
            max="250"
            required
          />
          <input
            class="feature-input-text"
            type="number"
            placeholder="Waga"
            id="weight"
            name="weight"
            min="20"
            max="400"
            required
          />
          <input
            class="feature-input-text"
            type="number"
            placeholder="Wiek"
            id="age"
            name="age"
            min="0"
            max="120"
            required
          />
          <input
            class="feature-input-text"
            type="number"
            placeholder="Docelowa waga"
            id="target-weight"
            name="targetWeight"
            min="20"
            max="400"
            required
          />
          <input
            class="feature-input-text"
            type="number"
            placeholder="Czas (dni)"
            id="time"
            name="time"
            min="1"
            max="1000"
            required
          />

          <div class="switch-container">
            <div id="is-imperial" class="feature-input-switch switch__off">
              <div class="feature-input-switch-slider"></div>
            </div>
            <!-- TODO -->
            <p class="switch-text">Jednostki imperialne</p>
          </div>

          <div class="radio-container">
            <input type="radio" id="sex-female" name="sex" value="female" />
            <label for="html">Kobieta</label><br />
            <input type="radio" id="sex-male" name="sex" value="male" checked />
            <label for="css">Mężczyzna</label><br />
          </div>

          <div class="slider-container">
            <label for="activity">Poziom aktywności</label>
            <input
              type="range"
              id="activity"
              name="activity"
              min="1"
              max="5"
              class="slider"
            />
          </div>

          <input class="feature-submit" type="submit" value="Oblicz!" />

          <div class="output"></div>
        </div>
      </form>
    </main>
  </body>
</html>
